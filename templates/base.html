<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ML Lab Exam{% endblock %}</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --ink:#1d2433; --muted:#667085; --line:#e3e6ee;
          --brand:#3b5bdb; --brand-d:#2f49b0; --ok:#1b7f4b; --err:#c92a2a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:var(--bg); color:var(--ink); line-height:1.5; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px 60px; }
  header.top { background:var(--brand); color:#fff; padding:14px 16px; }
  header.top .in { max-width:980px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  header.top a { color:#fff; text-decoration:none; }
  h1 { font-size:1.5rem; margin:0 0 4px; } h2 { font-size:1.15rem; margin:0 0 12px; }
  h3 { font-size:1rem; margin:16px 0 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:18px; }
  .muted { color:var(--muted); font-size:.92rem; }
  label { display:block; font-weight:600; font-size:.9rem; margin:10px 0 4px; }
  input[type=text], input[type=password], input[type=number], input[type=file], select, textarea {
    width:100%; padding:9px 11px; border:1px solid #cdd2de; border-radius:8px; font:inherit; background:#fff; }
  textarea { min-height:90px; resize:vertical; }
  button, .btn { display:inline-block; background:var(--brand); color:#fff; border:0; border-radius:8px;
    padding:9px 16px; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  button:hover, .btn:hover { background:var(--brand-d); }
  button.ghost, .btn.ghost { background:#eef0f7; color:var(--ink); }
  button.danger { background:#fff0f0; color:var(--err); border:1px solid #f3c2c2; }
  button.small { padding:4px 10px; font-size:.85rem; }
  .flash { padding:10px 14px; border-radius:8px; margin-bottom:14px; font-weight:500; }
  .flash.ok { background:#e6f6ec; color:var(--ok); } .flash.error { background:#fdecec; color:var(--err); }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:#fafbfd; font-size:.82rem; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); }
  .row { display:flex; gap:12px; flex-wrap:wrap; } .row > * { flex:1 1 200px; }
  .q { border-left:4px solid var(--brand); padding:4px 0 4px 14px; margin:14px 0; }
  .q .tag { display:inline-block; background:#e7ecff; color:var(--brand-d); font-weight:700; border-radius:6px; padding:1px 9px; margin-bottom:4px; }
  .qtext { white-space:pre-wrap; }
  details summary { cursor:pointer; color:var(--brand); font-weight:600; }
  form.inline { display:inline; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; } @media (max-width:760px){ .grid2{grid-template-columns:1fr;} }
  .badge { font-size:.72rem; background:#fff3bf; color:#8a6d00; border-radius:5px; padding:1px 6px; font-weight:700; }
  @media print { header.top, .noprint { display:none !important; } body { background:#fff; } .card { border:0; padding:0; } }
</style>
</head>
<body>
<header class="top"><div class="in">
  <a href="{{ url_for('home') }}"><strong>ML Lab Exam</strong></a>
  <span>{% block nav %}{% endblock %}</span>
</div></header>
<div class="wrap">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</div>
</body>
</html>
